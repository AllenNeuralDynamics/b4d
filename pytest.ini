# Camera driver tests from the repository root, all four together: python -m pytest
# b4d itself is tested from its folder (cd b4d && python -m pytest), against the built extension.
[pytest]
testpaths = egrabber/tests dcam/tests pvcam/tests tucam/tests
pythonpath = egrabber/src dcam/src pvcam/src tucam/src
addopts = -p no:cacheprovider -p no:napari -p no:napari-plugin-engine -p no:npe2 --import-mode=importlib
